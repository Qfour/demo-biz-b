name: ci
on:
  push: {branches: [main]}
  pull_request:

env:
  IMAGE: demo-biz-b:${{ github.sha }}
  SECURE_API_URL: https://app.au1.sysdig.com   # AU1 region

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Install sysdig-cli-scanner
        run: |
          VER=$(curl -fsSL https://download.sysdig.com/scanning/sysdig-cli-scanner/latest_version.txt)
          curl -fsSL -o sysdig-cli-scanner "https://download.sysdig.com/scanning/bin/sysdig-cli-scanner/${VER}/linux/amd64/sysdig-cli-scanner"
          chmod +x sysdig-cli-scanner
      - name: Scan image
        env:
          SECURE_API_TOKEN: ${{ secrets.SECURE_API_TOKEN }}
        run: |
          # exit 1 = policy evaluation failed (reported, not blocking in this demo).
          # Any other non-zero code (bad token, network, usage) fails the job.
          set +e
          ./sysdig-cli-scanner --apiurl "$SECURE_API_URL" \
            --output=json-file=scan.json \
            "docker://$IMAGE"
          rc=$?
          [ "$rc" -le 1 ] || exit "$rc"
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: sysdig-scan, path: scan.json, if-no-files-found: ignore}
