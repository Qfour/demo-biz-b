name: ci
on:
  push: {branches: [main]}
  pull_request:

env:
  IMAGE: demo-biz-b:${{ github.sha }}
  SECURE_API_URL: https://app.au1.sysdig.com   # AU1 region

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t "$IMAGE" .
      - name: Install sysdig-cli-scanner
        run: |
          VER=$(curl -sL https://download.sysdig.com/scanner/sysdig-cli-scanner/latest_version.txt)
          curl -sL -o sysdig-cli-scanner "https://download.sysdig.com/scanner/sysdig-cli-scanner/${VER}/linux/amd64/sysdig-cli-scanner"
          chmod +x sysdig-cli-scanner
      - name: Scan image
        env:
          SECURE_API_TOKEN: ${{ secrets.SECURE_API_TOKEN }}
        run: |
          # Policy failures are reported but do not block this demo; drop `|| true` to enforce.
          ./sysdig-cli-scanner --apiurl "$SECURE_API_URL" \
            --output=json-file=scan.json \
            "docker://$IMAGE" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: sysdig-scan, path: scan.json, if-no-files-found: ignore}
