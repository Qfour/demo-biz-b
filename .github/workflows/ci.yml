name: ci
on:
  push: {branches: [main]}
  pull_request:

jobs:
  ci:
    permissions:
      contents: read
      packages: write
      security-events: write
    uses: Qfour/demo-platform/.github/workflows/build-scan-push.yml@main
    with:
      image-name: ghcr.io/qfour/demo-biz-b
      stop-on-failed-policy-eval: false
      upload-sarif: false
    secrets:
      SECURE_API_TOKEN: ${{ secrets.SECURE_API_TOKEN }}
